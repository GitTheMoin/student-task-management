name: CI - build, test and tear down an environment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_workers_subdomain: ${{ secrets.WORKERS_SUBDOMAIN }}
      # Unique names per run, so CI never collides with your own deployment
      # or with an earlier run.
      TF_VAR_worker_name: student-task-manager-ci-${{ github.run_id }}
      TF_VAR_kv_namespace_name: student_tasks_ci_${{ github.run_id }}
      TF_VAR_environment: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        id: init
        run: terraform init

      - name: Terraform fmt (check)
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Smoke test the deployed app
        run: |
          URL=$(terraform output -raw application_url)
          SLEEP=${SMOKE_SLEEP:-10}
          echo "Testing $URL"

          # A brand-new workers.dev hostname can be unknown to some Cloudflare
          # edge locations for a while. They answer with a plain-text 404
          # ("error code: 1042") that never reaches the Worker. The Worker itself
          # always answers with JSON, so JSON is the signal that we reached it.

          # request METHOD PATH [JSON_BODY]  ->  sets STATUS, CTYPE, BODY, IS_JSON
          request() {
            local method=$1 path=$2 data=${3:-}
            local args=(-s -m 15 -o resp.body -D resp.head -w "%{http_code}" -X "$method" "$URL$path")
            if [ -n "$data" ]; then
              args+=(-H "Content-Type: application/json" -d "$data")
            fi
            rm -f resp.body resp.head
            STATUS=$(curl "${args[@]}" 2>/dev/null || true)
            [ -n "$STATUS" ] || STATUS=000
            CTYPE=$(grep -i '^content-type:' resp.head 2>/dev/null | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)
            BODY=$(head -c 120 resp.body 2>/dev/null | tr '\n' ' ' || true)
            IS_JSON=no
            case "$CTYPE" in application/json*) IS_JSON=yes ;; esac
          }

          # wait_for LABEL METHOD PATH EXPECTED_STATUS MAX_ATTEMPTS [JSON_BODY] [SUCCESSES_NEEDED]
          # Retries on 000, timeouts, 5xx and any non-JSON answer (edge 1042).
          # A JSON answer other than the expected status is also retried, except
          # JSON 400 (validation error), which fails immediately.
          wait_for() {
            local label=$1 method=$2 path=$3 expected=$4 max=$5 data=${6:-} needed=${7:-1}
            local streak=0 i
            for i in $(seq 1 "$max"); do
              request "$method" "$path" "$data"
              echo "[$label] attempt $i: HTTP $STATUS | ${CTYPE:-no content-type} | $BODY"
              if [ "$IS_JSON" = yes ] && [ "$STATUS" = 400 ]; then
                echo "[$label] validation error from the Worker, not retrying"
                return 1
              fi
              if [ "$IS_JSON" = yes ] && [ "$STATUS" = "$expected" ]; then
                streak=$((streak + 1))
                if [ "$streak" -ge "$needed" ]; then
                  return 0
                fi
              else
                streak=0
              fi
              sleep "$SLEEP"
            done
            echo "[$label] gave up after $max attempts"
            return 1
          }

          # 1. Worker reachable: JSON 200 twice in a row
          wait_for "reachable" GET /api/tasks 200 30 "" 2

          # 2. Create a task (retry until JSON 201)
          wait_for "create" POST /api/tasks 201 30 '{"title":"CI smoke test"}'
          cp resp.body created.json
          ID=$(sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' created.json | head -1)
          test -n "$ID"
          echo "Created task $ID"

          # 3. Read it back by id (a get by key shows up sooner than a list)
          wait_for "get by id" GET "/api/tasks/$ID" 200 30

          # 4. KV listings are eventually consistent: wait for the title to appear
          found=no
          for i in $(seq 1 18); do
            request GET /api/tasks
            if [ "$IS_JSON" = yes ] && [ "$STATUS" = 200 ] && grep -q 'CI smoke test' resp.body; then
              found=yes
              echo "[list] attempt $i: task found"
              break
            fi
            echo "[list] attempt $i: HTTP $STATUS | ${CTYPE:-no content-type} | $BODY"
            sleep "$SLEEP"
          done
          test "$found" = "yes"
          echo "Smoke test passed"

      # Runs even if an earlier step failed, so half-built environments are removed.
      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success'
        run: terraform destroy -auto-approve